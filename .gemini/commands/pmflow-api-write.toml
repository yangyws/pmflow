description = "用 API 權杖把資料直接寫進 PMFlow（建任務、關聯線、對外詢問）"

prompt = """
先讀 `D:\\NewProject\\pmflow-git\\docs\\API-WRITE.md`，那是所有 AI 共用的技能文件，
內容以它為準（不要憑記憶做，端點與權限規則今年改過好幾次）。

動手前必須知道的三件事：

1. 不要直接寫資料庫。排程重算、閉包表重建、對外詢問狀態、活動紀錄與通知都在 API 層做，
   繞過去的資料在畫面上會是壞的。
2. 權杖的權限完全等於發它的那個人，而且還要過關係人判斷（Ref: CR-130）——
   拿權杖去改別人開的任務照樣 403。這是最常見的失敗原因。
3. 會再跑第二次的東西一律寫成可重複執行的腳本（已建立的要認得出來並跳過）。

權杖只有人能產（網站 →「帳號設定」→「API 權杖」，明文只顯示一次）。
不要嘗試自己生一把，也不要把權杖寫進 repo。

專案總規矩在 `D:\\NewProject\\AGENTS.md`。

使用者的需求：{{args}}
"""
